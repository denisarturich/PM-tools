  <rect x="240" y="30" width="190" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8" style="fill:rgb(219, 234, 254);stroke:rgb(59, 130, 246);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="335" y="48" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#3b82f6" font-weight="600" style="fill:rgb(59, 130, 246);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">😔 Sad</text>
  <text x="335" y="65" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#3b82f6" style="fill:rgb(59, 130, 246);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">things that disappointed</text>

  <rect x="450" y="30" width="190" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8" style="fill:rgb(220, 252, 231);stroke:rgb(22, 163, 74);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="545" y="48" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#16a34a" font-weight="600" style="fill:rgb(22, 163, 74);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">😊 Glad</text>

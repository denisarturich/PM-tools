<svg width="100%" viewBox="10 0 670 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Board background -->
  <rect x="20" y="20" width="630" height="220" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" style="fill:rgb(250, 250, 250);stroke:rgb(226, 232, 240);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Column headers -->
  <rect x="30" y="30" width="190" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8" style="fill:rgb(254, 226, 226);stroke:rgb(220, 38, 38);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
